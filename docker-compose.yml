# Tahap 1 scope was database + API only, enough to run migrations and
# prove the deployment shape. `web` (the Next.js dashboard, docs/api.md)
# is added now that the API has real computed results to serve. Scheduler
# (Prefect), MLflow, and worker are still deferred (spec §36) -- adding
# them now would just be inert compose entries with nothing to verify
# against; `web` isn't, since apps/web is a real, working app now.

services:
  db:
    build:
      context: ./docker/db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idx}
      POSTGRES_DB: ${POSTGRES_DB:-idx_intelligence}
    ports:
      # Host port 5433, not 5432: many dev machines already run a native
      # PostgreSQL service on 5432 (Windows installs it as a service by
      # default), and binding the container there silently loses to it --
      # connections from the host land on the native instance instead,
      # with different credentials. Container-internal port stays 5432.
      - "5433:5432"
    volumes:
      - idx_db_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idx} -d ${POSTGRES_DB:-idx_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-idx}:${POSTGRES_PASSWORD:-idx}@db:5432/${POSTGRES_DB:-idx_intelligence}
      APP_ENV: ${APP_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Docker-network service name, not localhost -- this fetch happens
      # server-side inside the container, resolved via compose's DNS.
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"

volumes:
  idx_db_data:
