[project]
name = "idx-investment-intelligence"
version = "0.1.0"
description = "IDX Investment Intelligence Platform -- automated Indonesian stock research and decision-support system."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "prefect>=3.0",
    "httpx>=0.27",
    "yfinance>=0.2.40",
    "tenacity>=9.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "apps"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a running database (docker compose) -- run explicitly with -m integration",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
