name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -v
        # default addopts (-m "not integration") -- no database needed

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Start database (same image/init scripts as local dev)
        run: docker compose up -d db --wait

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+psycopg://idx:idx@localhost:5433/idx_intelligence
        run: alembic upgrade head

      - name: Run deterministic integration tests against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://idx:idx@localhost:5433/idx_intelligence
        run: pytest -v -m "integration and not live" --ignore-glob="**/*_live.py"
        # Tests marked live and *_live.py files call real external providers
        # (Yahoo/BPS/RSS/HuggingFace, etc.). They remain local/manual checks:
        # provider downtime or rate limits must not make deterministic CI red.
